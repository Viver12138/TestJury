name: contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: 契约检查与变异测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装检查依赖
        run: python -m pip install --upgrade pip pyyaml jsonschema pytest
      - name: 契约检查（docs / rubric / verdict / m0）
        run: python scripts/check_contracts.py
      - name: 变异测试（证明检查能发现漂移）
        run: python -m pytest tests/contract -q
