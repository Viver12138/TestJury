name: execution-gate

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "阶段门禁：S1/S2/S3/S4"
        required: true
        default: "S2"
        type: choice
        options: [S1, S2, S3, S4]

permissions:
  contents: read

jobs:
  gate:
    name: 阶段执行门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install --upgrade pip pyyaml jsonschema
      - name: 执行门禁（owner/证据/阶段出口）
        run: python scripts/check_execution_gate.py --stage ${{ inputs.stage }}
