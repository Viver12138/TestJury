# TestJury 执行与验收证据台账（机器可读）
# 事实源：docs/30（说明与证据模板）、docs/08 §2.16（Q-01–Q-18）、design/decisions.yaml。
# 状态模型：designed → implemented → verified → accepted；脚本检查通过只到 verified。
# 校验：scripts/check_execution_plan.py；accepted 必须有 acceptance_evidence / acceptance_by / acceptance_at。
version: "0.3"
baseline: design-v1.13
last_updated: "2026-11-10"

status_model: [designed, implemented, verified, accepted]

# stage_mapping 是唯一阶段定义（旧 stages.exit 已删除，避免两套出口）
stage_mapping:
  S1:
    milestones: [M0-pre]
    requires: [Q-07, Q-08, Q-09, Q-12, Q-13]
    note: 设计收口与责任人落实；不依赖生产级成果
  S2:
    milestones: [M1, M2]
    requires: [V-01, V-02, V-04]
    protocol: Q-14
    note: Rubric 只要求可加载/可校验，不要求 production 发布
  S3:
    milestones: [M4, M5, M6]
    requires: [V-03A, V-05, V-06, V-07, V-08]
    note: 含 Rubric 效果验证（V-03A）
  S4:
    milestones: [production]
    requires: [V-03B, V-09, V-10, V-11, V-12]
    note: 含 Rubric 正式发布（V-03B）

# 阶段出口的最低状态要求（R1）：owner/decision 与状态分开，不由 owner 代替完成
stage_gates:
  S1:
    Q-07: owner_assigned
    Q-08: decision_recorded
    Q-09: owner_assigned
    Q-12: owner_assigned
    Q-13: owner_assigned
  S2:
    V-01: verified
    V-02: verified
    V-04: verified
  S3:
    V-03A: accepted
    V-05: accepted
    V-06: accepted
    V-07: accepted
    V-08: accepted
  S4:
    V-03B: accepted
    V-09: accepted
    V-10: accepted
    V-11: accepted
    V-12: accepted

rubric_lifecycle:
  M0: [schema_and_structure_loadable, draft_rejected_in_production]
  M2_M6: [effectiveness_validation_on_real_data, regression]
  production: [review_approve_publish_freeze_rollback]

state_transitions:
  - {from: designed, to: implemented, allowed: true}
  - {from: implemented, to: verified, allowed: true}
  - {from: verified, to: accepted, allowed: true}
  - {from: verified, to: implemented, allowed: true, reason: 验证失败或发现实现缺陷}
  - {from: accepted, to: implemented, allowed: true, conditional: true, reason: 重大变更或验收失效}
  - {from: accepted, to: verified, allowed: true, conditional: true, reason: 需重新验证但实现无需重做}

evidence_policy:
  root: evidence/
  manifest_required: true
  history_required: true
  history_format: jsonl
  overwrite_original: false
  invalidate_on_version_change: true

# 按验证项声明版本依赖（P1-02）：只校验与本项相关的版本，避免不相关版本变化使证据失效
version_dependencies:
  V-01: [design, code_commit, model_config, adapter]
  V-02: [design, code_commit, dataset, rubric]
  V-03A: [design, code_commit, rubric, dataset, model_config]
  V-03B: [design, code_commit, rubric]
  V-04: [design, code_commit, kb, embedding_profile]
  V-05: [design, code_commit]
  V-06: [design, code_commit, rubric, prompt, model_config, dataset]
  V-07: [design, code_commit, kb, dataset]
  V-08: [design, code_commit]
  V-09: [design, code_commit, model_config]
  V-10: [design, code_commit]
  V-11: [design, code_commit]
  V-12: [design, code_commit, model_config]

