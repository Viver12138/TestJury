# TestJury M0 验收用例、P0 契约清理用例与 BIZ 业务边界用例（机器可读）
# 事实源：docs/08 §5.2（M0 十项退出条件）、docs/28（用例说明与追踪链）、docs/12（Verdict）、docs/00 §6/§8（业务边界）。
# 用法：scripts/check_m0_acceptance.py 校验结构、覆盖度与追踪字段；
#       CI 按 ci_job 分组执行；result 在 M0 执行后回填为 passed/failed。
# 约定：
#   - 每个 M0 退出条件至少 1 条用例；每个 P0 契约项与 BIZ 业务项至少 1 条用例；
#   - automation/test_file/ci_job 不得为空，避免"列出条件但无法执行"；
#   - 用例 ID 稳定，后续实现不得复用或改号。
version: "1.0"
baseline: docs/08 §5.2
last_updated: "2026-11-10"

ci_jobs:
  - id: contract
    description: 文档/Schema/Rubric/决策索引/Verdict/M0 用例的契约检查
  - id: unit
    description: 纯单元测试（无 DB、无网络、无真实模型）
  - id: migration
    description: 空库迁移、回滚、约束生效
  - id: mock-e2e
    description: Mock 供应商全链路（创建→评审→报告→复核）
  - id: ci-all
    description: 聚合门禁，要求以上 Job 全部通过

exit_conditions:
  - id: M0-01
    module: 工程骨架
    requirement: FastAPI 启动；配置加载；结构化日志；统一异常/错误码
  - id: M0-02
    module: 数据库
    requirement: PostgreSQL + pgvector 可用；Alembic 空库迁移成功；回滚一次
  - id: M0-03
    module: 全局枚举
    requirement: Python Enum 与 docs/17 一致；CI 校验
  - id: M0-04
    module: Report Schema
    requirement: 加载、校验、识别 report_schema_version
  - id: M0-05
    module: Rubric
    requirement: 加载、Schema/业务校验、冻结版本；draft 拒绝生产模式
  - id: M0-06
    module: Verdict
    requirement: 真值表全部组合单元测试通过；ai_verdict 只由 verdict.py 产生
  - id: M0-07
    module: 权限
    requirement: API Key → 角色；越权/伪造 X-Role 拒绝
  - id: M0-08
    module: 状态机
    requirement: 任务/阶段/复核任务非法迁移被拒；fencing 双 Worker 测试
  - id: M0-09
    module: CI
    requirement: 单测 + 契约检查 + 迁移测试；不依赖真实模型
  - id: M0-10
    module: 可观测性
    requirement: request_id/trace_id 贯穿；关键阶段有指标

contract_items:
  - id: P0-1
    title: 幂等/代次契约收口
    doc: docs/28 §2、docs/03 §1.1
    acceptance: 重复、并发、force、同键不同体均有明确输入、响应与状态；DB 约束与 API 行为一致
  - id: P0-2
    title: 跨文档契约自动检查
    doc: docs/28 §3
    acceptance: 干净仓库通过；改动枚举/Schema/Rubric/决策索引后 CI 失败并指出文件与字段
  - id: P0-3
    title: M0 退出条件转可执行用例
    doc: docs/28 §4
    acceptance: 十项退出条件全部映射到用例；每条用例有失败判定、自动化方式与关联测试文件
  - id: P0-4
    title: Verdict 属性与边界测试
    doc: docs/28 §5
    acceptance: 真值表可执行；关键规则有正例/反例/边界例；8 条不变量有自动化保护
  - id: BIZ-1
    title: 业务范围与职责边界
    doc: docs/00 §6/§8、docs/03 §1、docs/09 §5.2
    acceptance: 非 functional 测试类型被明确拒绝；AI 结论不表达审批；评审限制可见；11 个业务维度有 Rubric 映射

cases:
  # ── M0-01 工程骨架 ──
  - id: ACC-M0-001
    maps_to: M0-01
    title: 服务启动、存活探针与统一错误 envelope
    preconditions: [空数据库, Mock 配置, 无真实模型 Key]
    input: 启动 API 进程；GET /livez；GET /v1/not-exist
    steps:
      - 以 dev 配置启动 uvicorn，等待 ready
      - 请求 /livez，断言 200 且 body.status=ok
      - 请求不存在的路由，断言 404 且 error.code=NOT_FOUND、含 request_id
      - 检查 stdout 日志为 JSON，且包含 request_id 与 method
    expected:
      - /livez 返回 200
      - 错误响应符合 docs/19 §1 envelope
      - 日志可被 jq 解析且 request_id 与响应头一致
    failure_criteria: [启动超时, envelope 字段缺失, 日志非 JSON, request_id 不一致]
    automation: pytest + fastapi.testclient
    test_file: tests/m0/test_bootstrap.py
    ci_job: unit
    result: not_run

  - id: ACC-M0-002
    maps_to: M0-01
    title: 配置缺失时快速失败而非带病启动
    preconditions: [删除 DATABASE_URL 或设为空]
    input: 启动命令
    steps:
      - 在缺少必填配置的环境中启动
      - 观察退出码与 stderr
    expected:
      - 进程以非 0 退出
      - 错误信息指明缺失的配置项，不打印密钥
      - 不监听端口
    failure_criteria: [使用默认值静默启动, 监听端口后崩溃, 打印密钥]
    automation: subprocess + pytest
    test_file: tests/m0/test_config.py
    ci_job: unit
    result: not_run

  # ── M0-02 数据库 ──
  - id: ACC-M0-003
    maps_to: M0-02
    title: 空库迁移成功并可回滚一次
    preconditions: [全新 PostgreSQL 16 + pgvector, 空库]
    input: alembic upgrade head；alembic downgrade -1；再次 upgrade head
    steps:
      - upgrade head，断言退出码 0
      - 查询 pg_extension 确认 vector 存在
      - 断言核心表存在（review_jobs/review_decisions/review_stages/review_candidates/issue_votes）
      - downgrade -1 后再次 upgrade head
    expected:
      - 两次 upgrade 均成功
      - 回滚只撤销一个 revision，不破坏其他表
      - 迁移脚本无破坏性 DROP 历史表
    failure_criteria: [迁移报错, 扩展缺失, 回滚后无法重建, 重复执行失败]
    automation: pytest + alembic CLI + psql
    test_file: tests/migration/test_migrations.py
    ci_job: migration
    result: not_run

  - id: ACC-M0-004
    maps_to: M0-02
    title: 幂等唯一索引与状态 CHECK 真实生效
    preconditions: [迁移完成]
    input: 直接 SQL 插入测试数据
    steps:
      - 插入同 idempotency_key 的两条 active 记录，断言唯一冲突
      - 将旧记录 superseded_by 指向新记录后，断言可再插入下一代次
      - 插入 status=unknown，断言 CHECK 失败
      - 插入 generation=0，断言 CHECK 失败
    expected:
      - 部分唯一索引阻止双 active
      - superseded 记录不阻塞新代次
      - 非法状态与非法代次被数据库拒绝
    failure_criteria: [双 active 成功, CHECK 未生效, 索引条件写错]
    automation: pytest + SQLAlchemy
    test_file: tests/migration/test_constraints.py
    ci_job: migration
    result: not_run

  # ── M0-03 全局枚举 ──
  - id: ACC-M0-005
    maps_to: M0-03
    title: Python Enum 与 docs/17 同源
    preconditions: [代码枚举已落地]
    input: 导入 app.core.enums，逐个枚举对比 docs/17
    steps:
      - 运行 scripts/check_docs.py
      - 断言 AppStatus/AiVerdict/HumanStatus/IssueStatus/EvidenceStatus 等集合与字典完全相等
      - 断言不存在字典外取值
    expected:
      - 检查脚本退出码 0
      - 所有枚举集合相等，差异为空
    failure_criteria: [集合不一致, 脚本未覆盖某枚举, 通过手工复制同步]
    automation: scripts/check_docs.py + pytest
    test_file: tests/contract/test_enums.py
    ci_job: contract
    result: not_run

  - id: ACC-M0-006
    maps_to: M0-03
    title: 非法枚举值被拒绝
    preconditions: [API 可启动]
    input: POST /v1/reviews，case.source=unknown；DB 写入 status=unknown
    steps:
      - 提交非法 source，断言 422 INPUT_INVALID 且不建任务
      - 直接写库非法状态，断言 CHECK 失败
    expected:
      - API 不猜测、不静默改写非法枚举
      - 数据库层同样拒绝
    failure_criteria: [非法值被接受, 被静默改成默认值, 只在前端校验]
    automation: pytest + TestClient
    test_file: tests/m0/test_api_validation.py
    ci_job: unit
    result: not_run

  # ── M0-04 Report Schema ──
  - id: ACC-M0-007
    maps_to: M0-04
    title: 报告 Schema 加载、校验与版本识别
    preconditions: [schemas/report.schema.json 存在]
    input: 一份合法 fixture、一份缺 versions 的 fixture、一份 report_schema_version=report-9.9 的 fixture
    steps:
      - 加载 Schema 并断言为合法 JSON Schema
      - 合法 fixture 通过校验
      - 缺失必填字段被拒绝，错误定位到字段路径
      - 未知版本被加载器拒绝，不按最新版强转
    expected:
      - 合法报告通过
      - 非法报告失败且错误含字段路径
      - 未知 report_schema_version 拒绝加载
    failure_criteria: [Schema 未校验, 未知版本被强转, 错误只有一句"校验失败"]
    automation: pytest + jsonschema
    test_file: tests/unit/test_report_schema.py
    ci_job: unit
    result: not_run

  - id: ACC-M0-008
    maps_to: M0-04
    title: 报告 Schema 与冻结副本一致
    preconditions: [schemas/versions/report-1.0.schema.json 存在]
    input: 比较两份文件
    steps:
      - 断言 report.schema.json 与冻结副本 SHA-256 相同
      - 断言 $id 与 report_schema_version 常量一致
    expected: 字节级一致；版本号与文件一一对应
    failure_criteria: [冻结副本被改动, 版本号与文件不匹配]
    automation: scripts/check_rubric.py --schemas 或 pytest
    test_file: tests/contract/test_schema_freeze.py
    ci_job: contract
    result: not_run

  # ── M0-05 Rubric ──
  - id: ACC-M0-009
    maps_to: M0-05
    title: Rubric 加载、Schema 与业务校验
    preconditions: [rubric/rubric.yaml 与 schema.json 存在]
    input: 合法 Rubric；draft 状态；重复 checkpoint ID
    steps:
      - 合法 Rubric 通过 Schema + 业务校验
      - 生产模式下 draft 拒绝启动
      - 重复 checkpoint ID 被业务校验器拒绝
    expected:
      - 加载失败即拒绝启动（生产）
      - 业务约束（core claim、阈值、严重级）由独立校验器覆盖
    failure_criteria: [只做 JSON Schema, draft 可进生产, 重复 ID 通过]
    automation: pytest + jsonschema + scripts/check_rubric.py
    test_file: tests/unit/test_rubric_loader.py
    ci_job: unit
    result: not_run

  - id: ACC-M0-010
    maps_to: M0-05
    title: Rubric 版本绑定与冻结副本一致
    preconditions: [rubric/rubric.yaml 可加载, rubric/versions/ 目录存在]
    input: 当前 rubric.version；对应冻结副本；一份历史报告 fixture
    steps:
      - 从 rubric.yaml 读取 version（不在用例中硬编码具体版本号）
      - 定位 versions/v<version>.yaml；断言文件存在且可解析
      - 断言冻结副本与主配置内容一致、必填字段完整
      - 断言报告/任务使用的 rubric_version 与当前活动版本一致
      - 模拟"版本已升级但副本缺失"：删除临时副本后断言检查失败
      - 用历史报告 fixture 断言能按当时 rubric_version 还原规则，不受新版本影响
    expected:
      - 主版本变更后验收自动定位正确副本；缺失副本明确失败
      - 活动版本与报告记录一致；历史报告可追溯
    failure_criteria: [验收硬编码历史版本号, 缺失副本仍通过, 历史报告被新版本覆盖]
    automation: scripts/check_rubric.py + pytest
    test_file: tests/contract/test_rubric_version_binding.py
    ci_job: contract
    result: not_run

  # ── M0-06 Verdict ──
  - id: ACC-M0-011
    maps_to: M0-06
    title: Verdict 真值表全部用例通过
    preconditions: [verdict.py 已实现]
    input: design/verdict_cases.yaml 全部用例
    steps:
      - 参数化运行全部固定/边界用例
      - 逐条比较 ai_verdict、issue 状态、human_review_required、completeness
      - 断言 ai_verdict 只由 verdict.py 产生
    expected: 用例 100% 通过，失败信息含 case_id 与规则 ID
    failure_criteria: [任一用例不一致, 其他模块另写一套判定]
    automation: pytest 参数化
    test_file: tests/unit/test_verdict_cases.py
    ci_job: unit
    result: not_run

  - id: ACC-M0-012
    maps_to: M0-06
    title: Verdict 属性不变量与禁止组合
    preconditions: [verdict.py 已实现]
    input: 随机生成票/证据/席位组合（≥1000 组）
    steps:
      - 校验 I1–I8 不变量
      - 校验 docs/12 §8 禁止组合从不出现
      - 断言 approved 永不产出
    expected: 属性测试全绿；发现违规时输出反例输入
    failure_criteria: [属性测试未覆盖, 违规只记日志不失败]
    automation: pytest + hypothesis 或固定种子随机
    test_file: tests/unit/test_verdict_properties.py
    ci_job: unit
    result: not_run

  - id: ACC-M0-013
    maps_to: M0-06
    title: 决策字段信任边界
    preconditions: [输出校验已实现]
    input: 模型输出携带 ai_verdict=approved / human_status=approved
    steps:
      - 模拟模型返回含决策字段
      - 断言服务端丢弃并记 parse_warning
      - 断言报告 ai_verdict 仍由规则计算
    expected: 模型不能写决策字段；出现即丢弃
    failure_criteria: [模型字段进入报告, 仅告警不丢弃]
    automation: pytest
    test_file: tests/unit/test_verdict_trust_boundary.py
    ci_job: unit
    result: not_run

  # ── M0-07 权限 ──
  - id: ACC-M0-014
    maps_to: M0-07
    title: API Key 角色映射与伪造 X-Role 拒绝
    preconditions: [API Key 授权表存在]
    input: reviewer Key + X-Role=admin；admin Key；无 Key
    steps:
      - reviewer 调审批接口，断言 403
      - 伪造 X-Role=admin，断言权限不提升，仅记日志
      - admin 调审批接口，断言 403（admin 不自动含 approver）
      - 无 Key 断言 401
    expected: 角色只来自服务端映射
    failure_criteria: [X-Role 生效, admin 可审批, 401/403 混用]
    automation: pytest + TestClient
    test_file: tests/m0/test_permissions.py
    ci_job: unit
    result: not_run

  - id: ACC-M0-015
    maps_to: M0-07
    title: 审批人与提交人分离
    preconditions: [DECISION_REQUIRE_SEPARATION=true]
    input: 同一 API Key 提交并审批
    steps:
      - 用同一身份提交评审并 approve
      - 断言 403 FORBIDDEN，审计记录拒绝原因
    expected: 自审被拒绝
    failure_criteria: [自审通过, 关闭开关后行为未记录]
    automation: pytest
    test_file: tests/m0/test_approval_separation.py
    ci_job: unit
    result: not_run

  # ── M0-09 CI ──
  - id: ACC-M0-016
    maps_to: M0-09
    title: CI 聚合门禁在无真实模型环境下全绿
    preconditions: [无外网, 无真实模型 Key]
    input: 运行 contract + unit + migration + mock-e2e
    steps:
      - 执行 scripts/check_contracts.py
      - 执行 pytest tests/unit tests/contract tests/migration
      - 执行 mock-e2e 冒烟
    expected: 全部退出码 0；不读取真实 API Key；耗时在阈值内
    failure_criteria: [依赖真实模型, 任一 Job 失败仍放行, 跳过契约检查]
    automation: CI pipeline
    test_file: tests/m0/test_ci_smoke.py
    ci_job: ci-all
    result: not_run

  - id: ACC-M0-017
    maps_to: M0-09
    title: 契约漂移可被自动发现（变异测试）
    preconditions: [契约检查脚本可运行]
    input: 在临时副本中修改 docs/17 的一个枚举值
    steps:
      - 复制仓库到临时目录
      - 修改 docs/17 的 ai_verdict 枚举
      - 在副本上运行 check_contracts.py
    expected:
      - 退出码非 0
      - 输出包含 docs/17 文件、枚举名、期望与实际差异
    failure_criteria: [修改后仍通过, 只报"检查失败"无定位]
    automation: pytest + 临时目录
    test_file: tests/contract/test_contract_drift.py
    ci_job: contract
    result: not_run

  # ── M0-08 状态机 ──
  - id: ACC-M0-018
    maps_to: M0-08
    title: 任务/阶段/复核任务非法迁移被拒
    preconditions: [状态机模块已实现]
    input: done→processing、cancelled→processing、queued→done、completed→pending
    steps:
      - 逐条调用迁移校验
      - 断言抛非法迁移错误且不改状态
    expected: 非法迁移全部拒绝；合法路径通过
    failure_criteria: [非法迁移被接受, 状态被部分写入]
    automation: pytest
    test_file: tests/m0/test_state_machine.py
    ci_job: unit
    result: not_run

  - id: ACC-M0-019
    maps_to: M0-08
    title: fencing token 双 Worker 写入保护
    preconditions: [租约与 fencing 已实现]
    input: Worker A 持有 token=1；租约过期后 B 接管 token=2
    steps:
      - B 领取并写阶段结果
      - A 用 token=1 写终稿
      - 断言影响行数 0，A 停止写入
    expected: 旧 Worker 写入被拒绝，新结果不被覆盖
    failure_criteria: [旧写入成功, 令牌只在应用层校验]
    automation: pytest + 真实 PostgreSQL
    test_file: tests/m0/test_fencing.py
    ci_job: migration
    result: not_run

  - id: ACC-M0-020
    maps_to: M0-08
    title: 阶段完成与跳过语义
    preconditions: [阶段执行已实现]
    input: 仲裁被条件跳过；渲染成功
    steps:
      - 执行 Mock 评审
      - 断言 stages_completed 不含 arbitration
      - 断言 stages_skipped 含 arbitration
      - 断言 review_completeness.complete 未被误置 true
    expected: 跳过不算完成，两者分列
    failure_criteria: [跳过计入 completed, complete 虚高]
    automation: pytest
    test_file: tests/m0/test_stage_completion.py
    ci_job: unit
    result: not_run

  # ── M0-10 可观测性 ──
  - id: ACC-M0-021
    maps_to: M0-10
    title: request_id / trace_id 贯穿与阶段指标
    preconditions: [日志与指标已接入]
    input: 一次 Mock 评审
    steps:
      - 断言响应头 X-Request-Id 与日志 request_id 一致
      - 断言关键阶段日志含 review_id/stage/attempt
      - 断言 /metrics 暴露阶段耗时分位与失败计数
    expected: 同一请求可串起全链路；指标可查询
