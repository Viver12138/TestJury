    steps:
      - 全部必需阶段成功 + 仲裁条件未触发跳过 → complete=true，stages_skipped 含 arbitration
      - 必需阶段被跳过 → complete=false
      - 必需阶段 failed → complete=false，stages_failed 非空
      - 必需阶段 pending/running → complete=false，stages_pending 非空
      - 3/3 全参与 + 可选阶段全完成 → complete=true；2/3 参与但阶段全成功 → complete=true 且 full_participation=false
      - 断言 stages_completed/skipped/failed/pending 互斥且覆盖所有阶段
    expected: complete 只表示流程完整性；参与度由 full_participation 表达；两者不得混用
    failure_criteria: [必需阶段跳过仍 complete=true, 2/3 被写成 complete=false 且无 full_participation, 阶段列表重叠]
    automation: pytest
    test_file: tests/m0/test_completeness.py
    ci_job: unit
    result: not_run

