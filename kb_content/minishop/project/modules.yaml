# MiniShop 模块清单
# 来源：Minishop/backend/app/api/ 路由划分、Minishop/frontend/src/pages/ 页面划分
# 说明：module_id 是知识库稳定标识，不得随展示名称变化。

id: PROJECT-MODULES
title: MiniShop 模块清单
knowledge_type: PROJECT
project_id: minishop
product_version: "1.0.0"
updated_at: 2026-11-11
source_ref: Minishop/backend/app/main.py#L62-L74

modules:
  - id: auth
    name: 认证与账号
    responsibility: 注册、登录、JWT 鉴权、当前用户信息
    api_prefixes: [/api/auth]
    knowledge_status: partial
    coverage: 本批只覆盖登录与鉴权的最小约束，供交易流程准备数据
    owner: minishop_project_team

  - id: catalog
    name: 商品与分类
    responsibility: 商品列表/详情、搜索、筛选、排序、SKU、分类查询
    api_prefixes: [/api/products, /api/categories]
    knowledge_status: partial
    coverage: 本批只覆盖与下单相关的商品可见性、SKU、价格、库存字段
    owner: minishop_project_team

  - id: cart
    name: 购物车
    responsibility: 加购、同 SKU 合并、改数量、删除、库存校验
    api_prefixes: [/api/cart]
    knowledge_status: partial
    coverage: 本批只覆盖下单前的加购与数量约束
    owner: minishop_project_team

  - id: address
    name: 收货地址
    responsibility: 地址增删改查、默认地址唯一
    api_prefixes: [/api/addresses]
    knowledge_status: partial
    coverage: 本批只覆盖下单必需的地址归属与快照
    owner: minishop_project_team

  - id: coupon
    name: 优惠券
    responsibility: 领券、我的优惠券、满减校验、后台发券
    api_prefixes: [/api/coupons, /api/admin/coupons]
    knowledge_status: partial
    coverage: 本批只覆盖下单用券的资格、门槛与占用/归还
    owner: minishop_project_team

  - id: order
    name: 订单与交易
    responsibility: 订单预览、创建、查询、取消、支付、发货、确认收货
    api_prefixes: [/api/orders, /api/payments, /api/admin/orders]
    knowledge_status: pilot
    coverage: 本批试点模块，端到端覆盖
    owner: minishop_project_team

  - id: after_sales
    name: 售后与退款
    responsibility: 退款申请、审核、拒绝、库存恢复
    api_prefixes: [/api/refunds, /api/admin/refunds]
    knowledge_status: later
    coverage: 未纳入本批；仅状态机中登记对订单状态的影响
    owner: minishop_project_team

  - id: review
    name: 商品评价
    responsibility: 完成订单评价、商品评价列表、后台删除
    api_prefixes: [/api/reviews, "/api/products/{id}/reviews", /api/admin/reviews]
    knowledge_status: later
    coverage: 未纳入本批；仅状态机中登记评价前置条件
    owner: minishop_project_team

  - id: admin
    name: 管理后台
    responsibility: Dashboard、用户、订单发货、库存、优惠券、评价管理
    api_prefixes: [/api/admin]
    knowledge_status: partial
    coverage: 本批只覆盖管理员发货与订单可见性
    owner: minishop_project_team

  - id: messaging
    name: 站内消息
    responsibility: 支付成功、发货、退款结果消息
    api_prefixes: [/api/messages]
    knowledge_status: later
    coverage: 未纳入本批
    owner: minishop_project_team

  - id: favorite
    name: 商品收藏
    responsibility: 收藏、取消收藏、收藏列表
    api_prefixes: [/api/favorites]
    knowledge_status: later
    coverage: 未纳入本批
    owner: minishop_project_team

  - id: inventory
    name: 库存管理
    responsibility: 后台库存查看与人工调整、库存日志
    api_prefixes: [/api/admin/inventory]
    knowledge_status: later
    coverage: 未纳入本批；下单库存扣减见 RULE-ORDER-009
    owner: minishop_project_team

# 模块依赖（下单链路）
dependencies:
  - from: order
    to: [auth, catalog, cart, address, coupon]
  - from: after_sales
    to: [order]
  - from: review
    to: [order, catalog]
