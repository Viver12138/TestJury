items:
- id: Q-01
  topic: 立即购买的产品定义
  question: 'README 声称支持“立即购买”。当前实现是加购后跳转购物车。产品期望是直接进入结算页， 还是“加购 + 去购物车”即为可接受行为？

    '
  related_ids:
  - CONFLICT-001
  - REQ-ORDER-001
  owner_role: product_owner
  blocking: true
  suggested_default: 按当前实现记录，不假定支持直接结算
  legacy_status: answered
  status_cn: 已确认
  decision: 接受建议
  decision_note: README#L51 仅列出"立即购买"功能名，未定义交互。确认以当前实现为准：加购后跳转 /cart（ProductDetail.tsx#L70-L77），不支持直接进入结算页；需在 REQ-ORDER-001
    与 README 补写该交互定义。
  decided_by: 平台设计者（产品负责人）
  decided_at: '2026-11-11'
  follow_up: 更新 REQ-ORDER-001、FLOW-ORDER-001，关闭 CONFLICT-001
  review_note: 连锁影响见 Q-03：立即购买会写入购物车，且下单后不清空。
  applied_at: '2026-11-12'
  legacy_blocking_resolved: true
  decision_status: decided
  documentation_status: synced
  implementation_status: pending
  verification_status: not_verified
- id: Q-02
  topic: 库存预占与超卖
  question: '下单是否需要锁定/预占库存？支付时库存不足应失败还是继续（当前 max 截断为 0）？ 超卖是已知限制还是缺陷？

    '
  related_ids:
  - CONFLICT-002
  - GAP-012
  - RULE-ORDER-003
  - RULE-ORDER-009
  owner_role: product_owner
  blocking: true
  suggested_default: 记录为风险，不把超卖写成正确规则
  legacy_status: answered
  status_cn: 已确认
  decision: 接受建议
  decision_note: 确认不引入库存预占。下单仅校验 sku.stock（orders.py#L55-L56）不占用不扣减；支付成功时 max(stock-qty,0) 截断扣减且不校验（payments.py#L22-L26），存在并发超卖窗口。定性为
    Demo 已知限制，不得写成"库存充足即安全"；生产化前必须引入预占或支付时二次校验。
  decided_by: 平台设计者（产品负责人）
  decided_at: '2026-11-11'
  follow_up: 更新 RULE-ORDER-003/009、STATE-ORDER-001，关闭 CONFLICT-002、GAP-012
  review_note: EXP-ORDER-001 R-01（蓝牙耳机 stock=1 双订单）保留为已知限制验证，不作为阻塞缺陷。
  applied_at: '2026-11-12'
  legacy_blocking_resolved: true
  decision_status: decided
  documentation_status: reviewed
  implementation_status: not_required
  verification_status: not_verified
- id: Q-03
  topic: 下单后购物车处理
  question: 下单成功后是否应清空已购买的购物车项？当前不清空。
  related_ids:
  - RULE-ORDER-006
  - EXP-ORDER-001
  owner_role: product_owner
  blocking: true
  suggested_default: 按当前实现断言“不清空”，并标记待确认
  legacy_status: answered
  status_cn: 已确认
  decision: 修改
  decision_note: 维持"下单不清空购物车"为当前行为（orders.py#L116-L170；OrderConfirm.tsx#L47-L62 仅清 sessionStorage），但不接受把它当作无副作用的简化：立即购买=加购（ProductDetail.tsx#L70-L77）+
    同 SKU 数量累加（cart.py#L65-L75）→ 对同一 SKU 二次"立即购买"会使结算数量翻倍；累加后超库存直接 400"库存不足，无法合并"（如蓝牙耳机 stock=1）。要求文档明确该连锁限制，UI 用例下单前清理购物车或改用
    API 造数。
  decided_by: 平台设计者（产品负责人）
  decided_at: '2026-11-11'
  follow_up: 更新 RULE-ORDER-006；确认是否清空购物车
  review_note: 首版判"接受建议"偏松，复核后改判"修改"；后续版本评估下单后按 SKU 清除已购项。
  applied_at: '2026-11-12'
  legacy_blocking_resolved: true
  decision_status: decided
  documentation_status: synced
  implementation_status: not_required
  verification_status: not_verified
- id: Q-04
  topic: 退款拒绝后的订单状态
  question: '已发货/已完成订单申请退款被拒绝后，应回到 PAID、SHIPPED 还是 COMPLETED？ 当前统一回 PAID。

    '
  related_ids:
  - CONFLICT-010
  - STATE-ORDER-001
  - EXP-ORDER-001
  owner_role: product_owner
  blocking: true
  suggested_default: 期望恢复到退款前状态；当前实现作为缺陷/风险记录
  legacy_status: answered
  status_cn: 已确认
  decision: 修改
  decision_note: 确认应恢复退款前状态。当前 admin.py#L241 把所有 REFUNDING 统一改回 PAID，SHIPPED/COMPLETED 事实丢失、物流单仍存在，状态机不自洽。修复：refunds 增加 pre_refund_status（申请退款时快照），拒绝时按快照恢复。修复前按缺陷记录，用例预期以"应恢复原状态"为准。
  decided_by: 平台设计者（产品负责人）
  decided_at: '2026-11-11'
  follow_up: 更新 STATE-ORDER-001、RULE-ORDER-010，关闭 CONFLICT-010
  review_note: 影响 STATE-ORDER-001 转换表第 70 行与 RULE-ORDER-010。
