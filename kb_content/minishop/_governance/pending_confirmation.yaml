- id: Q-05
  topic: 多支付记录时订单详情的支付展示
  question: '同一订单支付失败后重试成功时，订单详情的 payment 应展示最新一条、成功一条， 还是保持第一条？当前关系为单对象且未排序。

    '
  related_ids:
  - CONFLICT-007
  - RULE-ORDER-008
  - API-ORDER-003
  owner_role: tech_lead
  blocking: true
  suggested_default: 期望展示成功/最新支付；当前行为标记待确认
  legacy_status: answered
  status_cn: 已确认
  decision: 修改
  decision_note: 确认订单详情应展示成功/最新支付。实测（本项目 .venv，SQLAlchemy 2.0.36）：同一订单存在 FAILED+SUCCESS 两条支付记录时，Order.payment（models.py#L192
    uselist=False）稳定返回第一条 FAILED，并抛 SAWarning "Multiple rows returned with uselist=False"——即订单已 PAID 而详情 payment.status 恒为
    FAILED，属确定性缺陷而非"断言不稳定"。修复：关系改多对象并按 paid_at/id 排序，或增加 current_payment_id；同步 common.py#L164-L174 与 orders.py#L190。
  decided_by: 平台设计者（技术负责人）
  decided_at: '2026-11-11'
  follow_up: 更新 RULE-ORDER-008、API-ORDER-003，关闭 CONFLICT-007
  review_note: 复核阶段新增实测证据，严重度由"高"上调为必须修复项。
  applied_at: '2026-11-12'
  legacy_blocking_resolved: true
  decision_status: decided
  documentation_status: synced
  implementation_status: pending
