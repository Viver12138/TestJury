- id: Q-06
  topic: 优惠券 total_quantity 语义
  question: 'total_quantity 限制的是“发放总量”还是“使用总量”？当前领券不计数，用券才计数。

    '
  related_ids:
  - CONFLICT-006
  - RULE-ORDER-004
  - EXP-ORDER-001
  owner_role: product_owner
  blocking: true
  suggested_default: 期望为发放总量；当前实现作为不一致记录
  legacy_status: answered
  status_cn: 已确认
  decision: 修改
  decision_note: 确认 total_quantity 语义为"发放总量"（与建议默认值一致）。当前三处不一致：领券用 used_quantity>=total_quantity 判"已领完"（coupons.py#L83）；领券不计数、用券才
    +1（orders.py#L166）；可用券查询用 used_quantity+当前用户是否已领（coupons.py#L51，claimed 为集合故最多计 1）。修复：领券时按 count(user_coupons.coupon_id)
    判发放上限并计数，用券不再回写发放计数，三处统一。
  decided_by: 平台设计者（产品负责人）
  decided_at: '2026-11-11'
  follow_up: 更新 RULE-ORDER-004、DATA-ORDER-001，关闭 CONFLICT-006
  review_note: 首版 CONFLICT-006 裁决误写"明确为使用总量"，与本结论相反，已一并更正。
  applied_at: '2026-11-12'
  legacy_blocking_resolved: true
  decision_status: decided
  documentation_status: synced
  implementation_status: pending
  verification_status: not_verified
- id: Q-07
  topic: 优惠券 start_time 是否生效
  question: 未到 start_time 的券是否允许领取/使用？当前两处都只校验 end_time。
  related_ids:
  - GAP-013
  - RULE-ORDER-004
  owner_role: product_owner
  blocking: false
  suggested_default: 期望未生效券不可领/不可用；当前行为待确认
  legacy_status: answered
  status_cn: 已确认
  decision: 接受建议
  decision_note: 期望行为为"未生效券不可领、不可用"；当前领券与用券均只校验 end_time（coupons.py#L76、orders.py#L74）。Demo 阶段接受现状并记为已知限制。测试数据缺口：seed.py#L134-L137
    全部券 start_time 均为过去时间，无法构造"未生效券"场景 → 券边界用例须经 admin API 造数。另实测种子库（播种于 2026-09-21）：券#1「新人满100减10」end_time=2026-10-21 已自然过期但
    status 仍为 ACTIVE，故 coupons.py#L76-L77 的"已过期"分支可达；券#4 名为"已过期"却被置 DISABLED（seed.py#L144），走的是"已停用"分支。
  decided_by: 平台设计者（产品负责人）
  decided_at: '2026-11-11'
  follow_up: 更新 RULE-ORDER-004，关闭 GAP-013
  review_note: 首版曾断言"已过期分支不可达"，经只读实测 minishop.db 更正为"可达（券#1 自然过期）"。券#1 过期还导致可领券仅剩 2 张、e2e_test.py#L81 抛 StopIteration 中止，详见文档审核
    AUTO-FRAMEWORK 与 GAP-004。
