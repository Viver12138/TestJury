<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TestJury · Excel 用例评审</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#24334a;background:#f3f5f8}*{box-sizing:border-box}body{max-width:1320px;margin:34px auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:30px;margin:0}header p{color:#65738a;margin:9px 0}.tag{background:#e3ebff;color:#2d4b98;padding:8px 14px;border-radius:8px;font-size:14px}.nav{display:flex;gap:10px;margin:22px 0}main{display:grid;grid-template-columns:minmax(360px,1fr) minmax(400px,1.12fr);gap:24px;align-items:start}.card{background:white;border:1px solid #dce2eb;border-radius:16px;padding:26px}h2{font-size:20px;margin:0 0 10px}h3{font-size:18px}.hint{font-size:13px;color:#65738a;line-height:1.8}.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;border:2px dashed #bbcae8;border-radius:12px;background:#f7f9fe;margin:22px 0 12px;padding:22px;text-align:center;cursor:pointer;gap:10px}.drop.drag{background:#e7eeff;border-color:#254edb}.drop:focus-within{outline:3px solid #acbdf4;outline-offset:3px}.drop strong{font-size:17px}.file-icon{font-size:28px;font-weight:700;color:#254edb;background:#e6edff;padding:12px 17px;border-radius:12px}.pick{background:#254edb;color:white;padding:9px 18px;border-radius:8px;font-size:14px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button,a{font:inherit}button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:#254edb;color:white}button:disabled{opacity:.5;cursor:default}.secondary{background:#e8edf6;color:#33476b}.link{color:#254edb;text-decoration:none;font-size:14px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}.status{padding:13px 15px;background:#eef3ff;border-radius:9px;white-space:pre-wrap;line-height:1.7;font-size:14px}.error{color:#ab2634;white-space:pre-wrap;font-size:14px;line-height:1.7}.warning{background:#fff7df;border-radius:8px;padding:10px;font-size:13px;color:#775219;white-space:pre-wrap;line-height:1.7}.file-info{font-size:14px;overflow-wrap:anywhere}details{margin:12px 0}summary{cursor:pointer;line-height:1.8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 system-ui}.case-preview{padding:12px;background:#f7f9fc;border-radius:8px}.case-preview p{margin:5px 0;white-space:pre-wrap;font-size:13px;line-height:1.8}.case-list{max-height:390px;overflow:auto}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5;font-size:14px}.item span{overflow-wrap:anywhere}.item button{flex-shrink:0;padding:7px 12px}.progress{height:7px;background:#e7edf7;border-radius:7px;margin:15px 0;overflow:hidden}.progress>div{height:100%;width:0;background:#254edb;transition:width .3s}#history{margin-top:18px;max-height:300px;overflow:auto}#history button{display:block;text-align:left;width:100%;margin:7px 0;background:#edf1f8;color:#33476b}select,textarea,input:not([type=file]){width:100%;border:1px solid #cbd4e1;border-radius:7px;padding:10px;font:inherit;color:inherit;background:white}textarea{resize:vertical;min-height:85px;margin:8px 0}#report{line-height:1.8;overflow-wrap:anywhere}#download{margin-top:16px}#batch{margin-top:22px;border-top:1px solid #edf0f5;padding-top:18px}[hidden]{display:none!important}@media(max-width:850px){main{grid-template-columns:1fr}body{padding:0 16px;margin:20px auto}header{align-items:start}.card{padding:20px}.tag{white-space:nowrap;font-size:12px}}
</style></head><body>
<header><div><h1>TestJury</h1><p>上传测试用例，让评审有据可查。</p></div><span class="tag" id="mode">正在连接服务</span></header>
<nav class="nav" aria-label="报告导航"><button class="secondary" id="recent">历史报告</button><button class="secondary" id="gaps">知识待核实</button></nav>
<main><section class="card"><h2>上传用例文件</h2><p class="hint">上传 Excel 后预览用例，再开始批量评审。当前默认评审 MiniShop 订单，依据已冻结的实现版本。</p>
<label class="drop" id="drop" for="file"><span class="file-icon" aria-hidden="true">XLS</span><strong>将 Excel 拖到这里，或选择文件</strong><span class="hint">支持 .xlsx、.xls · 单次最多 50 条用例 · 文件不超过 10 MB</span><span class="pick">选择 Excel 文件</span><input id="file" class="visually-hidden" type="file" accept=".xlsx,.xls" aria-label="上传 Excel 用例文件"></label>
<div class="actions"><a class="link" href="/v1/imports/excel-template" download>下载 Excel 模板</a><span class="hint">仅接收文件，无需手工录入</span></div>
<p id="file-info" class="file-info" role="status">尚未选择文件</p><p id="error" class="error" role="alert"></p><div id="warnings" class="warning" hidden></div>
<div id="preview" hidden><h3 id="preview-title"></h3><div id="preview-cases" class="case-list"></div><div class="actions"><span class="hint">确认文件内容后提交评审</span><button id="submit" disabled>开始批量评审</button></div></div>
<section id="batch" hidden><h3>批量评审进度</h3><div id="batch-status" role="status"></div><div class="progress" role="progressbar" aria-label="批量评审进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div><div id="batch-items" class="case-list"></div><button id="download-batch" class="secondary" style="margin:12px 0" hidden>下载整批 Excel 报告</button><button id="retry-batch" class="secondary" hidden>重新获取进度</button></section>
<div id="history"></div></section>
<section class="card"><h2>评审报告</h2><div class="status" id="status" role="status">上传文件并开始评审后，可逐条查看结果。</div><div id="report"><p class="hint">报告将展示发现的问题、修改建议与知识来源。批量评审中，每条用例会独立生成报告。</p></div><button id="download" class="secondary" hidden>下载 Excel 报告</button></section></main>
<script>
const $=id=>document.getElementById(id);let currentReviewId='',pollTimer=null,viewGeneration=0,uploadGeneration=0,batchTimer=null,batchId=null,parsed=null,busy=false;
const statusLabels={queued:'等待评审',processing:'正在评审',retrying:'正在重试',done:'评审完成',completed_with_warnings:'评审完成，待复核',failed:'评审失败',cancelled:'已取消'};
function showReport(report){
  const root=$('report');root.replaceChildren();
  function add(tag,text,parent=root){const el=document.createElement(tag);el.textContent=text;parent.appendChild(el);return el;}
  add('h3',({blocked:'发现需要修改的问题',conditional:'本次评审已完成',need_human:'存在分歧，需要复核'})[report.ai_verdict]||'本次未形成完整结论');
  add('p','共 '+report.issues.length+' 条问题。'+(report.issues.length?'请结合下面的依据和修改建议处理。':'在本条用例的评审范围内，未发现明确问题。'));
  for(const issue of report.issues){const card=add('div','');card.style.cssText='border-top:1px solid #dce2eb;padding:16px 0;line-height:1.8';
    add('strong',({blocker:'需修改',major:'重要',suggestion:'建议'})[issue.severity]+' · '+issue.category,card);
    add('p',issue.rationale,card);if(issue.suggestion)add('p','修改建议：'+issue.suggestion,card);
    add('small',issue.kb_grounded?'已引用知识依据':'依据尚不充分，请复核',card);
    const review=add('details','',card);add('summary','记录复核反馈',review);feedbackForm(review,report.review_id,issue.issue_no);
  }
  const missed=add('details','');add('summary','补充漏检问题',missed);feedbackForm(missed,report.review_id,null);
  const feedback=add('details','');add('summary','查看复核记录',feedback);
  const records=add('div','展开后加载复核记录。',feedback);
  feedback.ontoggle=async()=>{if(!feedback.open)return;try{const data=await(await api('/v1/reviews/'+encodeURIComponent(report.review_id)+'/feedback')).json();records.replaceChildren();if(!data.items.length)add('p','暂无复核记录。',records);for(const item of data.items){add('p',item.reviewer+' · '+(item.actor_type==='human'?'人工反馈':'服务代理反馈')+' · '+new Date(item.created_at).toLocaleString(),records);for(const issue of item.issues)add('p',(issue.issue_no?'问题 '+issue.issue_no:'第 '+issue.step_index+' 步漏检')+' · '+({adopted:'采纳',rejected:'不采纳',missed:'漏检'})[issue.verdict]+'：'+issue.note,records);}}catch(e){records.textContent=e.message}};
  const sources=add('details','');add('summary','查看知识来源',sources);
  for(const source of report.appendix?.knowledge_pack?.evidence||[])add('p',source.doc_id+' · '+source.heading_path+'\n'+source.source_ref,sources);
  const full=add('details','');add('summary','完整报告与追溯记录',full);add('pre',JSON.stringify(report,null,2),full);
}
function feedbackForm(parent,reviewId,issueNo){
  const form=document.createElement('form');form.style.marginTop='12px';parent.appendChild(form);
  const choice=document.createElement('select');choice.setAttribute('aria-label',issueNo?'复核结论':'漏检严重程度');
  const choices=issueNo?[['adopted','采纳此问题'],['rejected','不采纳（误报或重复）']]:[['major','重要问题'],['blocker','阻断问题'],['suggestion','建议']];
  for(const [value,label]of choices){const option=document.createElement('option');option.value=value;option.textContent=label;choice.appendChild(option)}form.appendChild(choice);
  let step;if(!issueNo){step=document.createElement('input');step.type='number';step.min='1';step.required=true;step.placeholder='发生漏检的步骤编号';step.setAttribute('aria-label','漏检步骤');form.appendChild(step)}
  const note=document.createElement('textarea');note.required=true;note.maxLength=2000;note.rows=2;note.placeholder='说明依据、修改建议或不采纳的原因';note.setAttribute('aria-label','复核说明');form.appendChild(note);
  const button=document.createElement('button');button.type='submit';button.textContent='保存复核反馈';button.className='secondary';form.appendChild(button);
  const message=document.createElement('p');message.className='hint';message.setAttribute('role','status');form.appendChild(message);
  form.onsubmit=async event=>{event.preventDefault();if(!note.value.trim()){message.textContent='请填写复核说明。';return}button.disabled=true;try{const item=issueNo?{issue_no:issueNo,verdict:choice.value,note:note.value.trim()}:{verdict:'missed',step_index:Number(step.value),severity:choice.value,note:note.value.trim()};await api('/v1/reviews/'+encodeURIComponent(reviewId)+'/feedback',{method:'POST',body:JSON.stringify({issues:[item]})});message.textContent='反馈已保存。原始报告保留，审批状态不变。';note.value=''}catch(e){message.textContent=e.message}finally{button.disabled=false}};
}


async function api(path,options={}){const response=await fetch(path,{...options,headers:{...(options.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(options.headers||{})}});if(!response.ok){let body;try{body=await response.json()}catch{body={}}throw new Error(body.error?.message||'服务暂时不可用，请稍后重试');}return response;}
function error(e){$('error').textContent=e.message;}
function node(tag,text,parent){const el=document.createElement(tag);el.textContent=text;parent.appendChild(el);return el;}
async function upload(file){if(busy||!file)return;const generation=++uploadGeneration;parsed=null;$('submit').disabled=true;$('preview').hidden=true;$('warnings').hidden=true;$('error').textContent='';$('file-info').textContent='正在读取 '+file.name+'…';if(!/\.(xlsx|xls)$/i.test(file.name)||file.size>10*1024*1024){$('file-info').textContent='请选择有效文件';error(new Error('请选择不超过 10 MB 的 .xlsx 或 .xls 文件'));return;}const body=new FormData();body.append('file',file);try{const result=await(await api('/v1/imports/excel',{method:'POST',body})).json();if(generation!==uploadGeneration)return;parsed=result;$('file-info').textContent=result.filename+' · 已识别 '+result.total+' 条用例';$('preview-title').textContent='用例预览 · '+result.total+' 条';$('preview-cases').replaceChildren();for(const c of result.cases){const details=document.createElement('details');details.className='case-preview';$('preview-cases').appendChild(details);node('summary',c.case_id+' · '+c.title,details);for(const pre of c.preconditions)node('p','前置：'+pre,details);for(const step of c.steps){node('p',step.index+'. '+step.action,details);node('p','预期：'+(step.expected||'未填写'),details);}}$('warnings').textContent=result.warnings.join('\n');$('warnings').hidden=!result.warnings.length;$('preview').hidden=false;$('submit').disabled=false;}catch(e){if(generation===uploadGeneration){$('file-info').textContent='文件未导入，请根据提示修改后重新选择';error(e);}}}
$('file').onchange=()=>upload($('file').files[0]);
for(const event of ['dragenter','dragover'])$('drop').addEventListener(event,e=>{e.preventDefault();if(!busy)$('drop').classList.add('drag');});
for(const event of ['dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.remove('drag');});
$('drop').addEventListener('drop',e=>{if(e.dataTransfer.files.length!==1){error(new Error('请一次上传一个工作簿'));return;}upload(e.dataTransfer.files[0]);});
function lock(value){busy=value;$('file').disabled=value;$('submit').disabled=value||!parsed;}
$('submit').onclick=async()=>{if(!parsed||busy)return;lock(true);$('error').textContent='';try{const result=await(await api('/v1/review-batches',{method:'POST',body:JSON.stringify({cases:parsed.cases,options:{strict_kb:true}})})).json();batchId=result.batch_id;try{sessionStorage.setItem('testjury-batch',batchId)}catch{}await pollBatch();}catch(e){error(e);lock(false);}};
async function pollBatch(){clearTimeout(batchTimer);$('batch').hidden=false;$('retry-batch').hidden=true;try{const result=await(await api('/v1/review-batches/'+encodeURIComponent(batchId))).json();const cancelled=result.items.filter(x=>x.status==='cancelled').length;const settled=result.done+result.failed+cancelled;const active=settled<result.total;$('batch-status').textContent='已完成 '+result.done+' / '+result.total+' · 失败 '+result.failed+(cancelled?' · 已取消 '+cancelled:'')+(active?' · 评审中':' · 本批评审结束');const percent=Math.round(100*settled/result.total);$('progress-fill').style.width=percent+'%';$('progress-fill').parentElement.setAttribute('aria-valuenow',percent);$('download-batch').hidden=false;$('batch-items').replaceChildren();for(const item of result.items){const row=node('div','',$('batch-items'));row.className='item';node('span',item.case_id+' · '+(statusLabels[item.status]||item.status),row);const button=node('button',['done','completed_with_warnings'].includes(item.status)?'查看报告':'查看状态',row);button.className='secondary';button.onclick=()=>selectReview(item.review_id);}lock(active);if(active)batchTimer=setTimeout(pollBatch,2500);}catch(e){$('batch-status').textContent='暂时无法读取进度，已提交的评审会继续运行。';$('retry-batch').hidden=false;error(e);}}
$('retry-batch').onclick=()=>pollBatch();
function selectReview(id){clearTimeout(pollTimer);viewGeneration++;$('download').hidden=true;poll(id);}
async function poll(id,generation=viewGeneration){try{const result=await(await api('/v1/reviews/'+encodeURIComponent(id))).json();if(generation!==viewGeneration)return;$('status').textContent=statusLabels[result.status]||result.status;if(result.report_available){currentReviewId=id;showReport(result.report);$('download').hidden=false;}else if(['failed','cancelled'].includes(result.status)){$('report').textContent='此条评审未完成，已有记录已保留。';}else{$('report').textContent='评审正在执行，请稍候。';pollTimer=setTimeout(()=>poll(id,generation),2500);}}catch(e){if(generation===viewGeneration)error(e);}}
$('recent').onclick=async()=>{try{const data=await(await api('/v1/reviews?limit=30')).json();$('history').replaceChildren();node('h3','历史报告',$('history'));if(!data.items.length)node('p','暂无历史报告',$('history'));for(const item of data.items){const b=node('button',(item.case_id||item.review_id)+' · '+(statusLabels[item.status]||item.status),$('history'));b.onclick=()=>selectReview(item.review_id);}}catch(e){error(e);}};
$('gaps').onclick=async()=>{try{const data=await(await api('/v1/knowledge/minishop/gaps')).json();clearTimeout(pollTimer);viewGeneration++;$('download').hidden=true;$('status').textContent='知识待核实 · '+data.items.length+' 条线索';$('report').replaceChildren();node('p',data.note,$('report'));for(const item of data.items)node('p',item.function_point+' · 出现 '+item.occurrences+' 次\n'+item.suspected_rule,$('report'));}catch(e){error(e);}};
async function downloadExcel(path,filename,button){button.disabled=true;$('error').textContent='';try{const response=await api(path);const url=URL.createObjectURL(await response.blob());const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){error(e);}finally{button.disabled=false;}}
$('download').onclick=()=>{if(currentReviewId)downloadExcel('/v1/reviews/'+encodeURIComponent(currentReviewId)+'/report.xlsx','TestJury-评审报告.xlsx',$('download'));};
$('download-batch').onclick=()=>{if(batchId)downloadExcel('/v1/review-batches/'+encodeURIComponent(batchId)+'/report.xlsx','TestJury-批量评审报告.xlsx',$('download-batch'));};
fetch('/ui-config').then(r=>r.json()).then(c=>{$('mode').textContent=c.mode==='live'?'真实模型 · '+({single:'单模型',dual:'双模型',multi:'三模型'})[c.topology]:'演示模式';if(c.access_mode!=='local')error(new Error('当前实例未开启本机免凭证访问，请使用本地启动入口。'));else{try{batchId=sessionStorage.getItem('testjury-batch')}catch{}if(batchId){lock(true);pollBatch();}}}).catch(()=>{$('mode').textContent='服务连接失败';});
</script></body></html>
