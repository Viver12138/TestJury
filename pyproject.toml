[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "testjury"
version = "0.1.0"
description = "评审团 Agent：功能测试用例质量评审服务（design-v1.12 / M0 实现）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "tenacity>=9.0",
  "structlog>=24.1",
  "jsonschema>=4.21",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider -ra"
markers = [
  "postgres: 需要真实 PostgreSQL + pgvector（通过 DATABASE_URL 提供）",
]

[tool.ruff]
line-length = 125
target-version = "py311"
extend-exclude = [".venv", "data", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["app"]
